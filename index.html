<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Interactive Birthday Wish</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; }

    #terminal-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; color: #00ff66; display: flex; flex-direction: column;
      justify-content: center; align-items: flex-start; padding: 10% 15%; z-index: 100;
    }
    .line { font-size: 1.2rem; line-height: 2rem; white-space: pre-wrap; }
    #start-btn {
      margin-top: 20px; padding: 10px 20px; background: #00ff66; color: #000;
      border: none; font-weight: bold; cursor: pointer; display: none; border-radius: 4px;
    }

    #canvas-container { width: 100vw; height: 100vh; }
    #instruction {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      color: #ffffff; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase;
      opacity: 0; transition: opacity 1s; pointer-events: none; text-shadow: 0 0 8px rgba(255, 255, 255, 0.8); z-index: 10; text-align: center;
    }
  </style>
</head>
<body>

  <!-- BACKGROUND AUDIO -->
  <audio id="bg-music" loop preload="auto">
    <source src="bg-music.mp3" type="audio/mpeg">
  </audio>

  <div id="terminal-overlay">
    <div id="typed-text" class="line"></div>
    <button id="start-btn">Click to View Experience 🎂</button>
  </div>

  <div id="instruction">Click Candle to Blow | Click Card to Zoom | Drag to Rotate</div>
  <div id="canvas-container"></div>

  <!-- Three.js & Plugins -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <script>
    // 1. TYPEWRITER EFFECT
    const lines = [
      "> lisha",
      "> ...",
      "> today is your birthday",
      "> ...",
      "> so i made you this computer program"
    ];
    let lineIdx = 0, charIdx = 0;
    const typedTextEl = document.getElementById("typed-text");
    const startBtn = document.getElementById("start-btn");
    const bgMusic = document.getElementById("bg-music");

    function typeLine() {
      if (lineIdx < lines.length) {
        let currentLine = lines[lineIdx];
        if (charIdx < currentLine.length) {
          typedTextEl.innerHTML += currentLine.charAt(charIdx);
          charIdx++;
          setTimeout(typeLine, 60);
        } else {
          typedTextEl.innerHTML += "<br/>";
          lineIdx++; charIdx = 0;
          setTimeout(typeLine, 400);
        }
      } else {
        startBtn.style.display = "inline-block";
      }
    }
    window.onload = typeLine;

    // 2. THREE.JS SCENE SETUP
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050508, 0.04);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 4, 9);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.05;

    // 3. LIGHTING
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const candleLight = new THREE.PointLight(0xffaa44, 3, 15);
    candleLight.position.set(0, 2.2, 0);
    scene.add(candleLight);

    // 4. TABLETOP
    const tableGeo = new THREE.BoxGeometry(10, 0.2, 8);
    const tableMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5 });
    const table = new THREE.Mesh(tableGeo, tableMat);
    table.position.y = -0.1;
    scene.add(table);

    const textureLoader = new THREE.TextureLoader();

    // 5. PHOTO PRINTED CAKE (Fallback Color if image missing)
    const cakeGroup = new THREE.Group();

    const plateGeo = new THREE.CylinderGeometry(2.1, 1.9, 0.08, 32);
    const plateMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 });
    const plate = new THREE.Mesh(plateGeo, plateMat);
    plate.position.y = 0.04;
    cakeGroup.add(plate);

    const cakeBodyGeo = new THREE.CylinderGeometry(1.6, 1.6, 0.8, 32);
    const cakeSideMat = new THREE.MeshStandardMaterial({ color: 0xffe4e1, roughness: 0.3 });
    
    // Fallback Material check for Cake Top
    const cakeTopMat = new THREE.MeshBasicMaterial({ color: 0xff69b4 });
    textureLoader.load('./photo1.jpg', (texture) => {
      cake.material[1] = new THREE.MeshBasicMaterial({ map: texture });
      cake.material[1].needsUpdate = true;
    }, undefined, () => {
      console.log("photo1.jpg not found, using fallback color.");
    });

    const cakeMaterials = [cakeSideMat, cakeTopMat, cakeSideMat];
    const cake = new THREE.Mesh(cakeBodyGeo, cakeMaterials);
    cake.position.y = 0.48;
    cakeGroup.add(cake);

    for (let i = 0; i < 20; i++) {
      const angle = (i / 20) * Math.PI * 2;
      const pearl = new THREE.Mesh(
        new THREE.SphereGeometry(0.1, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 })
      );
      pearl.position.set(Math.cos(angle) * 1.55, 0.88, Math.sin(angle) * 1.55);
      cakeGroup.add(pearl);
    }

    const candle = new THREE.Mesh(
      new THREE.CylinderGeometry(0.04, 0.04, 0.6, 16),
      new THREE.MeshStandardMaterial({ color: 0xff3366 })
    );
    candle.position.set(0, 1.18, -0.9);
    cakeGroup.add(candle);

    const flame = new THREE.Mesh(
      new THREE.SphereGeometry(0.08, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0xffcc00 })
    );
    flame.position.set(0, 1.55, -0.9);
    cakeGroup.add(flame);

    scene.add(cakeGroup);

    // 6. BIRTHDAY CARD
    let cardMesh;
    function createBirthdayCard() {
      const cardCanvas = document.createElement('canvas');
      cardCanvas.width = 512;
      cardCanvas.height = 340;
      const ctx = cardCanvas.getContext('2d');

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, cardCanvas.width, cardCanvas.height);

      ctx.strokeStyle = '#ff69b4';
      ctx.lineWidth = 12;
      ctx.strokeRect(10, 10, cardCanvas.width - 20, cardCanvas.height - 20);

      ctx.fillStyle = '#d81b60';
      ctx.font = 'bold 34px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('HAPPY BIRTHDAY! 🎈', cardCanvas.width / 2, 75);

      ctx.fillStyle = '#333333';
      ctx.font = '20px Arial';
      ctx.fillText('Wishing you a day filled with', cardCanvas.width / 2, 140);
      ctx.fillText('happiness, joy and success.', cardCanvas.width / 2, 180);
      ctx.fillText('May all your dreams come true! ✨', cardCanvas.width / 2, 220);

      ctx.fillStyle = '#ff1493';
      ctx.font = 'italic bold 22px Arial';
      ctx.fillText('— Best Wishes ❤️', cardCanvas.width / 2, 280);

      const texture = new THREE.CanvasTexture(cardCanvas);
      const cardGeo = new THREE.PlaneGeometry(2.2, 1.4);
      const cardMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
      cardMesh = new THREE.Mesh(cardGeo, cardMat);

      cardMesh.rotation.x = -Math.PI / 4;
      cardMesh.position.set(0, 0.2, 2.0);
      return cardMesh;
    }
    scene.add(createBirthdayCard());

    // 7. PHOTO FRAMES
    function createPhotoFrame(x, z, rotationY, imagePath) {
      const frameGroup = new THREE.Group();

      const outerGeo = new THREE.BoxGeometry(1.4, 1.8, 0.1);
      const outerMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, roughness: 0.3 });
      const frameOuter = new THREE.Mesh(outerGeo, outerMat);

      const photoGeo = new THREE.PlaneGeometry(1.2, 1.6);
      const photoMat = new THREE.MeshBasicMaterial({ color: 0x444444 }); // Fallback color

      textureLoader.load(imagePath, (texture) => {
        photo.material = new THREE.MeshBasicMaterial({ map: texture });
        photo.material.needsUpdate = true;
      }, undefined, () => {
        console.log(imagePath + " not found, using fallback color.");
      });

      const photo = new THREE.Mesh(photoGeo, photoMat);
      photo.position.z = 0.06;

      frameGroup.add(frameOuter);
      frameGroup.add(photo);
      frameGroup.position.set(x, 0.9, z);
      frameGroup.rotation.y = rotationY;
      return frameGroup;
    }

    scene.add(createPhotoFrame(-2.5, 0, 0.4, './photo1.jpg'));
    scene.add(createPhotoFrame(2.5, 0, -0.4, './photo2.jpg'));

    // 8. FLOATING 3D BALLOONS
    const balloons = [];
    function createBalloon(x, z, colorHex) {
      const balloonGroup = new THREE.Group();
      
      const geo = new THREE.SphereGeometry(0.45, 32, 32);
      geo.scale(1, 1.25, 1);
      const mat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.2, metalness: 0.1 });
      const balloon = new THREE.Mesh(geo, mat);
      balloonGroup.add(balloon);

      const lineGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, -0.5, 0),
        new THREE.Vector3(0, -2.5, 0)
      ]);
      const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 });
      const string = new THREE.Line(lineGeo, lineMat);
      balloonGroup.add(string);

      balloonGroup.position.set(x, 2, z);
      scene.add(balloonGroup);
      balloons.push(balloonGroup);
    }

    createBalloon(-3.5, -1, 0xff0055);
    createBalloon(-3.8, 1, 0xffbb00);
    createBalloon(3.5, -1, 0x00ccff);
    createBalloon(3.8, 1, 0xaa00ff);

    // 9. RAYCASTER FOR INTERACTION
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let isFlownOut = false;

    window.addEventListener('click', (event) => {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      const flameIntersects = raycaster.intersectObject(flame);
      if (flameIntersects.length > 0 && flame.visible) {
        flame.visible = false;
        gsap.to(candleLight, { intensity: 0.2, duration: 1 });
      }

      const cardIntersects = raycaster.intersectObject(cardMesh);
      if (cardIntersects.length > 0) {
        if (!isFlownOut) {
          gsap.to(camera.position, { x: 0, y: 1.5, z: 3.2, duration: 1.5, ease: "power2.inOut" });
          gsap.to(controls.target, { x: 0, y: 0.2, z: 2.0, duration: 1.5, ease: "power2.inOut" });
          isFlownOut = true;
        } else {
          gsap.to(camera.position, { x: 0, y: 4, z: 9, duration: 1.5, ease: "power2.inOut" });
          gsap.to(controls.target, { x: 0, y: 0, z: 0, duration: 1.5, ease: "power2.inOut" });
          isFlownOut = false;
        }
      }
    });

    // 10. ANIMATION LOOP
    function animate() {
      requestAnimationFrame(animate);

      if (flame.visible) {
        candleLight.intensity = 2.5 + Math.random() * 0.5;
      }

      balloons.forEach(b => {
        b.position.y += Math.sin(Date.now() * 0.002 + b.position.x) * 0.005;
      });

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // START BUTTON CLICK EVENT (PLAY AUDIO & START SCENE)
    startBtn.addEventListener('click', () => {
      document.getElementById('terminal-overlay').style.display = 'none';
      document.getElementById('instruction').style.opacity = '1';

      // Safe Audio Play Handler
      bgMusic.play().then(() => {
        console.log("Audio playing successfully.");
      }).catch((e) => {
        console.log("Audio autoplay prevented or file missing:", e);
      });

      gsap.from(camera.position, {
        x: 0, y: 10, z: 18, duration: 2.5, ease: "power2.out"
      });
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
