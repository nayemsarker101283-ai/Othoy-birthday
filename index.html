<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Photo Printed Cake - Birthday Wish</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; }

    #terminal-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; color: #00ff66; display: flex; flex-direction: column;
      justify-content: center; align-items: flex-start; padding: 10% 15%; z-index: 100;
    }
    .line { font-size: 1.2rem; line-height: 2rem; white-space: pre-wrap; }
    #start-btn {
      margin-top: 20px; padding: 10px 20px; background: #00ff66; color: #000;
      border: none; font-weight: bold; cursor: pointer; display: none; border-radius: 4px;
    }

    #canvas-container { width: 100vw; height: 100vh; }
    #instruction {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      color: #ffffff; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase;
      opacity: 0; transition: opacity 1s; pointer-events: none; text-shadow: 0 0 8px rgba(255, 255, 255, 0.8); z-index: 10; text-align: center;
    }
  </style>
</head>
<body>

  <div id="terminal-overlay">
    <div id="typed-text" class="line"></div>
    <button id="start-btn">Click to View Experience 🎂</button>
  </div>

  <div id="instruction">Touch & drag to rotate scene</div>
  <div id="canvas-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <script>
    // 1. TYPEWRITER EFFECT
    const lines = [
      "> lisha",
      "> ...",
      "> today is your birthday",
      "> ...",
      "> so i made you this computer program"
    ];
    let lineIdx = 0, charIdx = 0;
    const typedTextEl = document.getElementById("typed-text");
    const startBtn = document.getElementById("start-btn");

    function typeLine() {
      if (lineIdx < lines.length) {
        let currentLine = lines[lineIdx];
        if (charIdx < currentLine.length) {
          typedTextEl.innerHTML += currentLine.charAt(charIdx);
          charIdx++;
          setTimeout(typeLine, 60);
        } else {
          typedTextEl.innerHTML += "<br/>";
          lineIdx++; charIdx = 0;
          setTimeout(typeLine, 400);
        }
      } else {
        startBtn.style.display = "inline-block";
      }
    }
    window.onload = typeLine;

    // 2. THREE.JS SCENE SETUP
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050508, 0.04);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 4, 9);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.05;

    // 3. LIGHTING
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const candleLight = new THREE.PointLight(0xffaa44, 3, 15);
    candleLight.position.set(0, 2.2, 0);
    scene.add(candleLight);

    // 4. TABLETOP
    const tableGeo = new THREE.BoxGeometry(10, 0.2, 8);
    const tableMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5 });
    const table = new THREE.Mesh(tableGeo, tableMat);
    table.position.y = -0.1;
    scene.add(table);

    // Texture Loader
    const textureLoader = new THREE.TextureLoader();

    // 5. PHOTO PRINTED 3D BIRTHDAY CAKE
    const cakeGroup = new THREE.Group();

    // A. Plate
    const plateGeo = new THREE.CylinderGeometry(2.1, 1.9, 0.08, 32);
    const plateMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 });
    const plate = new THREE.Mesh(plateGeo, plateMat);
    plate.position.y = 0.04;
    cakeGroup.add(plate);

    // B. Cake Body (Base Layer)
    const cakeBodyGeo = new THREE.CylinderGeometry(1.6, 1.6, 0.8, 32);
    const cakeSideMat = new THREE.MeshStandardMaterial({ color: 0xffe4e1, roughness: 0.3 }); // Side color (Pink)
    const cakeTopTexture = textureLoader.load('./photo1.jpg'); // Top photo print
    const cakeTopMat = new THREE.MeshBasicMaterial({ map: cakeTopTexture });

    // Multi-material cylinder: Material index 0=Side, 1=Top (Printed Photo), 2=Bottom
    const cakeMaterials = [cakeSideMat, cakeTopMat, cakeSideMat];
    const cake = new THREE.Mesh(cakeBodyGeo, cakeMaterials);
    cake.position.y = 0.48;
    cakeGroup.add(cake);

    // C. Cream Border Around The Printed Photo
    for (let i = 0; i < 20; i++) {
      const angle = (i / 20) * Math.PI * 2;
      const pearl = new THREE.Mesh(
        new THREE.SphereGeometry(0.1, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 })
      );
      pearl.position.set(Math.cos(angle) * 1.55, 0.88, Math.sin(angle) * 1.55);
      cakeGroup.add(pearl);
    }

    // D. Bottom Border Frosting Pearls
    for (let i = 0; i < 20; i++) {
      const angle = (i / 20) * Math.PI * 2;
      const pearl = new THREE.Mesh(
        new THREE.SphereGeometry(0.08, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0xff69b4, roughness: 0.2 })
      );
      pearl.position.set(Math.cos(angle) * 1.6, 0.12, Math.sin(angle) * 1.6);
      cakeGroup.add(pearl);
    }

    // E. Candle & Flame on top of Printed Cake
    const candle = new THREE.Mesh(
      new THREE.CylinderGeometry(0.04, 0.04, 0.6, 16),
      new THREE.MeshStandardMaterial({ color: 0xff3366 })
    );
    candle.position.set(0, 1.18, -0.9); // Placed slightly on the back so photo stays clear
    cakeGroup.add(candle);

    const flame = new THREE.Mesh(
      new THREE.SphereGeometry(0.06, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0xffcc00 })
    );
    flame.position.set(0, 1.5, -0.9);
    cakeGroup.add(flame);

    scene.add(cakeGroup);

    // 6. BIRTHDAY CARD
    function createBirthdayCard() {
      const cardCanvas = document.createElement('canvas');
      cardCanvas.width = 512;
      cardCanvas.height = 340;
      const ctx = cardCanvas.getContext('2d');

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, cardCanvas.width, cardCanvas.height);

      ctx.strokeStyle = '#ff69b4';
      ctx.lineWidth = 12;
      ctx.strokeRect(10, 10, cardCanvas.width - 20, cardCanvas.height - 20);

      ctx.fillStyle = '#d81b60';
      ctx.font = 'bold 34px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('HAPPY BIRTHDAY! 🎈', cardCanvas.width / 2, 75);

      ctx.fillStyle = '#333333';
      ctx.font = '20px Arial';
      ctx.fillText('Wishing you a day filled with', cardCanvas.width / 2, 140);
      ctx.fillText('happiness, joy and success.', cardCanvas.width / 2, 180);
      ctx.fillText('May all your dreams come true! ✨', cardCanvas.width / 2, 220);

      ctx.fillStyle = '#ff1493';
      ctx.font = 'italic bold 22px Arial';
      ctx.fillText('— Best Wishes ❤️', cardCanvas.width / 2, 280);

      const texture = new THREE.CanvasTexture(cardCanvas);
      const cardGeo = new THREE.PlaneGeometry(2.2, 1.4);
      const cardMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
      const cardMesh = new THREE.Mesh(cardGeo, cardMat);

      cardMesh.rotation.x = -Math.PI / 4;
      cardMesh.position.set(0, 0.2, 2.0);
      return cardMesh;
    }
    scene.add(createBirthdayCard());

    // 7. PHOTO FRAMES
    function createPhotoFrame(x, z, rotationY, imagePath) {
      const frameGroup = new THREE.Group();

      const outerGeo = new THREE.BoxGeometry(1.4, 1.8, 0.1);
      const outerMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, roughness: 0.3 });
      const frameOuter = new THREE.Mesh(outerGeo, outerMat);

      const photoGeo = new THREE.PlaneGeometry(1.2, 1.6);
      const photoTexture = textureLoader.load(imagePath);
      const photoMat = new THREE.MeshBasicMaterial({ map: photoTexture });

      const photo = new THREE.Mesh(photoGeo, photoMat);
      photo.position.z = 0.06;

      frameGroup.add(frameOuter);
      frameGroup.add(photo);
      frameGroup.position.set(x, 0.9, z);
      frameGroup.rotation.y = rotationY;
      return frameGroup;
    }

    scene.add(createPhotoFrame(-2.5, 0, 0.4, './photo1.jpg'));
    scene.add(createPhotoFrame(2.5, 0, -0.4, './photo2.jpg'));

    // 8. ANIMATION
    function animate() {
      requestAnimationFrame(animate);
      candleLight.intensity = 2.5 + Math.random() * 0.5;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    startBtn.addEventListener('click', () => {
      document.getElementById('terminal-overlay').style.display = 'none';
      document.getElementById('instruction').style.opacity = '1';

      gsap.from(camera.position, {
        x: 0, y: 10, z: 18, duration: 2.5, ease: "power2.out"
      });
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
