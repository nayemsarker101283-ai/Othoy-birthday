<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday</title>
  <style>
    :root {
      --bg-color: #fbf5e8;
      --peach-glow: rgba(255, 182, 193, 0.6);
      --text-color: #e63946;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Container setup */
    .container {
      position: relative;
      width: 100%;
      max-width: 450px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    /* Video style background glow */
    .scene--arrow {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse 60% 55% at 62% 30%,
        var(--peach-glow) 0%,
        transparent 70%
      );
      z-index: 0;
      pointer-events: none;
    }

    /* Tree Branch Canvas / Container */
    .tree-container {
      position: relative;
      width: 300px;
      height: 300px;
      z-index: 1;
    }

    /* SVG Tree Trunk & Branches */
    .tree-svg {
      width: 100%;
      height: 100%;
    }

    /* Heart CSS */
    .heart {
      position: absolute;
      width: 16px;
      height: 16px;
      background-color: #ff4d6d;
      transform: rotate(-45deg);
      animation: heartBeat 2.6s ease-in-out infinite;
      transform-origin: 50% 55%;
      pointer-events: none;
      z-index: 2;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      background-color: #ff4d6d;
      border-radius: 50%;
    }

    .heart::before {
      top: -8px;
      left: 0;
    }

    .heart::after {
      left: 8px;
      top: 0;
    }

    /* Heart Beat Animation */
    @keyframes heartBeat {
      0%, 100% {
        transform: scale(1) rotate(-45deg);
      }
      50% {
        transform: scale(1.15) rotate(-45deg);
      }
    }

    /* Text Layer - Always on top */
    .text-container {
      position: relative;
      z-index: 10; /* Ensure text is above all hearts */
      margin-top: 20px;
    }

    .subtitle {
      font-size: 14px;
      color: #777;
      font-style: italic;
      margin-bottom: 5px;
    }

    .title {
      font-size: 32px;
      font-weight: bold;
      color: var(--text-color);
      line-height: 1.2;
    }

    .name {
      font-size: 36px;
      font-weight: 800;
      color: var(--text-color);
      margin-top: 4px;
    }

    .footer-text {
      font-size: 13px;
      color: #888;
      font-style: italic;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="scene--arrow"></div>

    <!-- Tree Structure -->
    <div class="tree-container" id="treeContainer">
      <svg class="tree-svg" viewBox="0 0 200 200">
        <!-- Trunk & Branches -->
        <path d="M100 190 Q98 140 100 110 Q90 80 60 60 M100 110 Q110 75 140 55 M100 130 Q80 100 50 90 M100 120 Q120 95 150 85" 
              stroke="#5a3d28" stroke-width="4" fill="none" stroke-linecap="round" />
      </svg>
    </div>

    <!-- Text Layer -->
    <div class="text-container">
      <p class="subtitle">a little something, for you</p>
      <h1 class="title">Happy Birthday</h1>
      <h1 class="name">Athoy</h1>
      <p class="footer-text">here's to a year that blooms!</p>
    </div>
  </div>

  <script>
    // JS: Dynamically generate heart leaves forming a tree crown
    const treeContainer = document.getElementById('treeContainer');
    const totalHearts = 65; // Total leaves/hearts

    // Heart creation logic based on heart shape distribution
    for (let i = 0; i < totalHearts; i++) {
      const heart = document.createElement('div');
      heart.classList.add('heart');

      // Math for parametric heart distribution shape
      const t = Math.random() * Math.PI * 2;
      const r = Math.sqrt(Math.random()); 
      
      // Heart parametric formulas for cluster shape
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

      // Positioning relative to tree crown center (X: ~150px, Y: ~70px)
      const posX = 150 + (x * r * 4.5) + (Math.random() * 10 - 5);
      const posY = 75 + (y * r * 4.5) + (Math.random() * 10 - 5);

      heart.style.left = `${posX}px`;
      heart.style.top = `${posY}px`;

      // Slight scale & animation delay variation for smooth natural feel
      const scale = 0.6 + Math.random() * 0.5;
      const delay = Math.random() * 2.6;
      heart.style.animationDelay = `${delay}s`;

      treeContainer.appendChild(heart);
    }
  </script>

</body>
</html>
