<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Interactive Birthday Wish</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: 'Courier New', Courier, monospace;
    }

    /* Terminal Overlay */
    #terminal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #00ff66;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 10% 15%;
      z-index: 100;
      cursor: pointer;
    }
    .line {
      font-size: 1.2rem;
      line-height: 2rem;
      white-space: pre-wrap;
    }
    #start-btn {
      margin-top: 20px;
      padding: 10px 20px;
      background: #00ff66;
      color: #000;
      border: none;
      font-weight: bold;
      cursor: pointer;
      display: none;
    }

    /* 3D Canvas Container */
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }

    /* On-Screen Prompt */
    #instruction {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: #ffffff;
      font-size: 1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 1s;
      pointer-events: none;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
      z-index: 10;
    }
  </style>
</head>
<body>

  <div id="terminal-overlay">
    <div id="typed-text" class="line"></div>
    <button id="start-btn">Click to View Experience 🎂</button>
  </div>

  <div id="instruction">Use mouse to rotate & zoom around the scene</div>

  <div id="canvas-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <script>
    // --- 1. TYPEWRITER EFFECT ---
    const lines = [
      "> lisha",
      "> ...",
      "> today is your birthday",
      "> ...",
      "> so i made you this computer program"
    ];
    
    let lineIdx = 0;
    let charIdx = 0;
    const typedTextEl = document.getElementById("typed-text");
    const startBtn = document.getElementById("start-btn");

    function typeLine() {
      if (lineIdx < lines.length) {
        let currentLine = lines[lineIdx];
        if (charIdx < currentLine.length) {
          typedTextEl.innerHTML += currentLine.charAt(charIdx);
          charIdx++;
          setTimeout(typeLine, 60);
        } else {
          typedTextEl.innerHTML += "<br/>";
          lineIdx++;
          charIdx = 0;
          setTimeout(typeLine, 400);
        }
      } else {
        startBtn.style.display = "inline-block";
      }
    }
    window.onload = typeLine;

    // --- 2. THREE.JS SCENE SETUP ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    // Add background fog for atmosphere
    scene.fog = new THREE.FogExp2(0x050508, 0.05);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.05; // Prevent camera from going below floor

    // --- 3. LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
    scene.add(ambientLight);

    // Warm Candle/Center Light
    const candleLight = new THREE.PointLight(0xffaa44, 2, 15);
    candleLight.position.set(0, 1.8, 0);
    candleLight.castShadow = true;
    scene.add(candleLight);

    // Subtle City Background Glow Light
    const cityLight = new THREE.DirectionalLight(0x334466, 0.8);
    cityLight.position.set(0, 10, -20);
    scene.add(cityLight);

    // --- 4. CREATING THE OBJECTS ---

    // Tabletop
    const tableGeo = new THREE.BoxGeometry(10, 0.2, 8);
    const tableMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.6 });
    const table = new THREE.Mesh(tableGeo, tableMat);
    table.position.y = -0.1;
    table.receiveShadow = true;
    scene.add(table);

    // Cake Base
    const cakeGroup = new THREE.Group();
    const cakeGeo = new THREE.CylinderGeometry(1.5, 1.5, 1, 32);
    const cakeMat = new THREE.MeshStandardMaterial({ color: 0xffe4e1, roughness: 0.4 });
    const cake = new THREE.Mesh(cakeGeo, cakeMat);
    cake.position.y = 0.5;
    cake.castShadow = true;
    cakeGroup.add(cake);

    // Candle
    const candleGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.6, 16);
    const candleMat = new THREE.MeshStandardMaterial({ color: 0xff3366 });
    const candle = new THREE.Mesh(candleGeo, candleMat);
    candle.position.y = 1.3;
    cakeGroup.add(candle);

    // Flame
    const flameGeo = new THREE.SphereGeometry(0.08, 16, 16);
    const flameMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
    const flame = new THREE.Mesh(flameGeo, flameMat);
    flame.position.y = 1.65;
    cakeGroup.add(flame);

    scene.add(cakeGroup);

    // Photo Frames
    function createFrame(x, z, rotationY) {
      const frameGroup = new THREE.Group();
      const outerGeo = new THREE.BoxGeometry(1.2, 1.6, 0.1);
      const outerMat = new THREE.MeshStandardMaterial({ color: 0xd4af37 }); // Gold
      const frameOuter = new THREE.Mesh(outerGeo, outerMat);
      
      const photoGeo = new THREE.PlaneGeometry(1, 1.4);
      const photoMat = new THREE.MeshStandardMaterial({ color: 0xcccccc });
      const photo = new THREE.Mesh(photoGeo, photoMat);
      photo.position.z = 0.06;

      frameGroup.add(frameOuter);
      frameGroup.add(photo);
      frameGroup.position.set(x, 0.8, z);
      frameGroup.rotation.y = rotationY;
      return frameGroup;
    }

    scene.add(createFrame(-2.5, 0, 0.4));
    scene.add(createFrame(2.5, 0, -0.4));

    // Simple City Skyline Backdrop
    const cityGroup = new THREE.Group();
    for (let i = -15; i < 15; i += 1.5) {
      const height = Math.random() * 8 + 4;
      const bldgGeo = new THREE.BoxGeometry(1.2, height, 1.2);
      const bldgMat = new THREE.MeshBasicMaterial({ color: 0x080815 });
      const bldg = new THREE.Mesh(bldgGeo, bldgMat);
      bldg.position.set(i * 1.5, height / 2 - 2, -15);
      cityGroup.add(bldg);
    }
    scene.add(cityGroup);

    // --- 5. ANIMATION & INTERACTION ---
    function animate() {
      requestAnimationFrame(animate);

      // Flame flickering effect
      candleLight.intensity = 1.8 + Math.random() * 0.4;
      
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Transition from Typewriter Screen to 3D Scene
    startBtn.addEventListener('click', () => {
      document.getElementById('terminal-overlay').style.display = 'none';
      document.getElementById('instruction').style.opacity = '1';

      // GSAP Camera zoom animation
      gsap.from(camera.position, {
        x: 0,
        y: 12,
        z: 25,
        duration: 3,
        ease: "power2.out"
      });
    });

    // Handle Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
