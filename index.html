<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Othoy</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #fdf5e6;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      text-align: center;
      position: relative;
    }

    .title {
      font-size: 3rem;
      color: #e63946;
      margin-top: 20px;
      animation: fadeIn 2s ease-in-out;
    }

    .highlight {
      font-size: 3.5rem;
      color: #d62828;
    }

    .subtitle, .wish {
      font-size: 1.1rem;
      color: #555;
      font-style: italic;
    }

    .heart {
      position: absolute;
      width: 15px;
      height: 15px;
      background-color: #ff4d6d;
      transform: rotate(-45deg);
      animation: heartBeat 2.6s ease-in-out infinite;
      transform-origin: 50% 50%;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 15px;
      height: 15px;
      background-color: #ff4d6d;
      border-radius: 50%;
    }

    .heart::before {
      top: -7.5px;
      left: 0;
    }

    .heart::after {
      left: 7.5px;
      top: 0;
    }

    @keyframes heartBeat {
      0% { transform: scale(1) rotate(-45deg); }
      50% { transform: scale(1.2) rotate(-45deg); }
      100% { transform: scale(1) rotate(-45deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="heart-tree"></div>
    <div class="text-container">
      <p class="subtitle">a little something, for you</p>
      <h1 class="title">Happy Birthday <br><span class="highlight">Athoy</span></h1>
      <p class="wish">here's to a year that blooms!</p>
    </div>
  </div>

  <script>
    const container = document.getElementById('heart-tree');

    function createHeartTree() {
      for (let i = 0; i < 40; i++) {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        
        const x = Math.random() * 200 - 100;
        const y = Math.random() * -150 - 50;
        
        heart.style.left = `calc(50% + ${x}px)`;
        heart.style.top = `calc(50% + ${y}px)`;
        heart.style.animationDelay = `${Math.random() * 2}s`;
        
        container.appendChild(heart);
      }
    }

    createHeartTree();
  </script>

</body>
</html>
